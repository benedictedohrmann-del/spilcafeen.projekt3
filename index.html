<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spil Cafeen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Vælg et Spil</h1>
        </header>

        <main>
            <div class="search-container">
                <input type="search" id="search-input" placeholder="Søg efter spil..." class="search-input">

                <select id="predefined-search" class="predefined-select">
                    <option value="">---- Sorter efter ----</option>
                    <option value="populaere">Mest populære</option>
                    <option value="2-3 personer">2-3 personer</option>
                    <option value="3+ personer">3+ personer</option>
                </select>

                <button id="filter-toggle" class="filter-button">
                    <span>🔍 Filtrer</span>
                </button>
            </div>

            <div id="filter-panel" class="filter-panel">
                <div class="filter-header">
                    <h2>Filtrer spil</h2>
                    <button id="close-filter" class="close-button">&times;</button>
                </div>

                <div class="filter-content">
                    <div class="filter-group">
                        <label class="filter-label">Kategori</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="elektronik"> Kort Spil
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="tøj"> Brætspil
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="møbler"> Terninge spil
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="bøger"> Alle
                            </label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Antal spillere</label>
                        <div class="price-range">
                            <input type="number" id="min-price" placeholder="Min pris" class="price-input">
                            <span class="price-separator">-</span>
                            <input type="number" id="max-price" placeholder="Max pris" class="price-input">
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Vurdering</label>
                        <div class="rating-group">
                            <label class="rating-label">
                                <input type="radio" name="rating" value="5"> ★★★★★
                            </label>
                            <label class="rating-label">
                                <input type="radio" name="rating" value="4"> ★★★★
                            </label>
                            <label class="rating-label">
                                <input type="radio" name="rating" value="3"> ★★★
                            </label>
                            <label class="rating-label">
                                <input type="radio" name="rating" value="2"> ★★
                            </label>
                            <label class="rating-label">
                                <input type="radio" name="rating" value="1"> ★
                            </label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Varighed</label>
                        <div class="color-group">
                            <label class="color-label">
                                <input type="checkbox" name="color" value="rød"> 5-10 min
                            </label>
                            <label class="color-label">
                                <input type="checkbox" name="color" value="blå"> 10-20 min
                            </label>
                            <label class="color-label">
                                <input type="checkbox" name="color" value="grøn"> 20-30 min
                            </label>
                            <label class="color-label">
                                <input type="checkbox" name="color" value="sort"> 30-40 min
                            </label>
                            <label class="color-label">
                                <input type="checkbox" name="color" value="hvid"> 40-60 Min
                            </label>
                        </div>
                    </div>
                </div>

                <div class="filter-footer">
                    <button id="apply-filters" class="apply-button">Find et Spil</button>
                </div>
            </div>

            <div id="products-container" class="products-container">
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Produkt Katalog</p>
        </footer>
    </div>

    <dialog id="product-dialog">
        <article class="dialog-content">
            <img id="dialog-image" src="" alt="" class="product-image">
            <h2 id="dialog-title"></h2>
            <p id="dialog-description"></p>
            <div class="product-meta">
                <span id="dialog-price" class="product-price"></span>
                <span id="dialog-category" class="product-category"></span>
            </div>
            <div id="dialog-rating" class="product-rating"></div>
            <menu class="dialog-actions">
                <button id="dialog-close" value="cancel">Luk</button>
            </menu>
        </article>
    </dialog>

    <div id="overlay" class="overlay"></div>
    <script src="data.js"></script>
    <script src="scriptui.js"></script>
    <script src="scriptfilt.js"></script>
</body>

</html>
